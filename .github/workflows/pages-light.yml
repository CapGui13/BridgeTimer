name: BridgeTimer Light — web et GitHub Pages

on:
  push:
    branches:
      - main
      - publication-light-web-20261031
    paths:
      - index.html
      - .nojekyll
      - checks/test_light_browser_site.py
      - .github/workflows/pages-light.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-timer-light-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-browser:
    name: Test Browser Light on Windows Edge
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser tests
        run: python -m pip install --disable-pip-version-check playwright==1.56.0
      - name: Open Light over HTTP and test real browser features
        run: python checks/test_light_browser_site.py

  deploy-pages:
    name: Publish Light to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: verify-browser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare only the public Light application
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
          test -s _site/index.html
          if grep -q 'EDITION EPUREE' _site/index.html; then
            echo "Light-only public site prepared"
          else
            echo "Missing Light-mode marker" >&2
            exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
