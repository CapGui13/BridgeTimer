name: Exploratory BridgeTimer clock 10% audit
on:
  push:
    branches: [audit/clock-10pct-edgecases-20261031]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check playwright==1.56.0
      - name: Edge cases not in the production test suite
        run: python checks/audit_clock_10pct_edgecases.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-clock-10pct-edgecases
          path: audit_outputs/
          if-no-files-found: warn
