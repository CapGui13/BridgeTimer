name: Publish unsigned release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, for example 1.7.8
        required: true
        default: '1.7.8'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - run: go mod download
      - run: python patch_webview_dark.py
      - name: Regression guard
        run: python checks/check_regressions.py
      - name: JavaScript syntax
        run: python checks/check_js_syntax.py
      - name: Verify release version
        shell: pwsh
        run: |
          $meta = Get-Content versioninfo.json -Raw | ConvertFrom-Json
          $expected = [string]$meta.StringFileInfo.ProductVersion
          if ("${{ inputs.version }}" -ne $expected) {
            throw "Release version ${{ inputs.version }} does not match source version $expected"
          }
      - name: Generate Windows resources
        shell: pwsh
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
          goversioninfo -o resource_windows_amd64.syso versioninfo.json
      - name: Vet
        run: go vet ./...
      - name: Build portable EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags "-H=windowsgui -s -w" -o dist/BridgeTimer.exe .
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ inputs.version }}"
          gh release create $tag dist/BridgeTimer.exe --title "Bridge Timer ${{ inputs.version }}" --generate-notes
