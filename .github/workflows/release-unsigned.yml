name: Publish unsigned release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, for example 1.7.4
        required: true
        default: '1.7.4'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - run: go mod download
      - run: python patch_webview_dark.py
      - name: Generate Windows resources
        shell: pwsh
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
          goversioninfo -o resource_windows_amd64.syso versioninfo.json
      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags "-H=windowsgui -s -w" -o dist/BridgeTimer.exe .
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ inputs.version }}"
          gh release create $tag dist/BridgeTimer.exe --title "Bridge Timer ${{ inputs.version }}" --notes-file RELEASE_NOTES_1.7.4.md
