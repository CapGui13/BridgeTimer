name: Build Bridge Timer - Strict Homothety

on:
  push:
    branches:
      - fix-homothetie-stricte-20261030
      - fix-gallery-keys-20261030
      - fix-retour-tests-remove-test-son-20261030
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-homothety:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Dependencies
        run: go mod download
      - name: Apply verified dark WebView2 title patch
        run: python patch_webview_dark.py
      - name: JavaScript syntax
        run: python checks/check_js_syntax.py
      - name: Install Edge browser test dependency
        run: python -m pip install --disable-pip-version-check playwright==1.56.0 pillow==11.3.0
      - name: Strict homothety at seven sizes + fade/no movement
        run: python checks/test_strict_homothety.py
      - name: Gallery full footer and Settings F/F11
        run: python checks/test_gallery_keys_settings.py
      - name: Audio alerts remain functional without the test button
        run: python checks/test_audio_robustness.py
      - name: Four-second controls auto-hide
        run: python checks/test_controls_autohide.py
      - name: Event title descenders
        run: python checks/test_event_title_descenders.py
      - name: Fullscreen entry/exit
        run: python checks/test_fullscreen_no_jump.py
      - name: Windows Go unit tests
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Generate Windows resources
        shell: pwsh
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
          goversioninfo -o resource_windows_amd64.syso versioninfo.json
      - name: Build EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags "-H=windowsgui -s -w" -o dist/BridgeTimer.exe .
      - name: Verify embedded production HTML
        run: python checks/check_exe_embed.py
      - uses: actions/upload-artifact@v4
        with:
          name: BridgeTimer-Retour-Tests-Sans-Test-Son-30oct2026
          path: dist/BridgeTimer.exe
          if-no-files-found: error
