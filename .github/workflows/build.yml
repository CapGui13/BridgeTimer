name: Build Bridge Timer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Download Go dependencies
        run: go mod download
      - name: Patch WebView2 dark title before first ShowWindow
        run: python patch_webview_dark.py
      - name: Regression guard
        run: python checks/check_regressions.py
      - name: JavaScript syntax
        run: python checks/check_js_syntax.py
      - name: State machine behavior
        run: node checks/test_state_machine.js
      - name: Generate Windows resources
        shell: pwsh
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
          goversioninfo -o resource_windows_amd64.syso versioninfo.json
      - name: Vet
        run: go vet ./...
      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags "-H=windowsgui -s -w" -o dist/BridgeTimer.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: BridgeTimer-Windows-unsigned
          path: dist/BridgeTimer.exe
          if-no-files-found: error
      - name: Prepare comparison edition with separate port, mutex and profile
        run: python checks/create_comparison_variant.py
      - name: Build independent comparison edition
        shell: pwsh
        run: |
          go build -trimpath -ldflags "-H=windowsgui -s -w" -o dist/BridgeTimer_Comparaison.exe ./comparison_build
      - uses: actions/upload-artifact@v4
        with:
          name: BridgeTimer-Comparaison-Windows
          path: dist/BridgeTimer_Comparaison.exe
          if-no-files-found: error
      - name: Prepare validated message-header edition
        shell: pwsh
        run: Copy-Item variants/BridgeTimer_MSG_bandeau.html timer.html -Force
      - name: Verify message-header JavaScript syntax
        run: python checks/check_js_syntax.py
      - name: Build BridgeTimer with M toggle and header editor
        shell: pwsh
        run: |
          go build -trimpath -ldflags "-H=windowsgui -s -w" -o dist/BridgeTimer_MSG_bandeau.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: BridgeTimer-M-Message-Bandeau
          path: dist/BridgeTimer_MSG_bandeau.exe
          if-no-files-found: error
